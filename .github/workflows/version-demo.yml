name: Version mismatch demo
on:
  push:
    branches: [chore/version-mismatch-demo]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch master for the "before" run
        run: git fetch https://github.com/cadence-workflow/cadence-go-client.git master:refs/remotes/origin/master

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Start Cadence server
        run: docker compose -f docker/github_actions/docker-compose.yml up -d cassandra statsd cadence

      - name: Run the scenario before and after the fix
        # Copied out first, because the script checks out other commits while it runs.
        run: cp demo/run.sh /tmp/run.sh && bash /tmp/run.sh

      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-demo-logs
          path: logs/
